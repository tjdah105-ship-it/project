
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>오늘 뭐 먹지?</h1>
        <p>나에게 맞는 메뉴 추천</p>
    </header>

    <main>
        <section class="recommend">
            <h2>오늘의 메뉴 추천</h2>
            <p>원하는 음식 종류를 선택하세요.</p>

            <div class="categories">
                <button>한식</button>
                <button>중식</button>
                <button>일식</button>
                <button>양식</button>
                <button>분식</button>
                <button>상관없음</button>
            </div>

            <button id="recommendBtn">메뉴 추천받기</button>
        </section>

        <section class="result">
            <h2>추천 결과</h2>
            <p id="resultText">추천 메뉴가 여기에 표시됩니다.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
